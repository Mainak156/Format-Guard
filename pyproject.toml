[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "format-guard"
version = "0.1.0"
description = "Validate, repair, retry, and safely consume structured LLM output."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Mainak Sen" }
]

keywords = [
    "llm",
    "ai",
    "validation",
    "structured-output",
    "pydantic",
    "guardrails",
    "agents",
    "langchain",
    "groq"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
groq = [
    "groq>=0.30,<1.0",
]

langchain = [
    "langchain-groq>=1.1,<2.0",
]

api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

all = [
    "groq>=0.30,<1.0",
    "langchain-groq>=1.1,<2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

dev = [
    "groq>=0.30,<1.0",
    "langchain-groq>=1.1,<2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "build>=1.2",
    "twine>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/Mainak156/FormatGuard"
Repository = "https://github.com/Mainak156/FormatGuard"
Issues = "https://github.com/Mainak156/FormatGuard/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["format_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"